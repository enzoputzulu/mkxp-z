# Au nom de demain : version Windows seule, branche and-shaders (shaders de jeu)
name: Automatic Build

on:
  push:
    branches: ['and-shaders']
    paths-ignore: ['*.md', '*.json', '*.png']
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    env:
      # CMake 4 refuse les CMakeLists qui demandent une version antérieure à 3.5 (libjpeg-turbo, physfs...)
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            base-devel
            git
            ruby
            vim
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc


      - name: Checkout repository
        uses: actions/checkout@v4

      # Le cache des dépendances est enregistré dès qu'elles sont construites, même si l'exe échoue ensuite.
      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build all dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          cd windows
          make

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build exe
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          # GCC 13 et plus n'incluent plus <cstdint> par ricochet
          export CXXFLAGS="-include cstdint"
          meson build
          cd build
          ninja
          strip ./mkxp-z.exe

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          mkdir build/artifact
          cd build/artifact
          cp /mingw64/bin/zlib1.dll .
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          cp ../mkxp-z.exe .
          cp ../../mkxp.json .

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.windows.${{github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: |
            build/artifact/*.dll
            build/artifact/*.exe
            build/artifact/mkxp.json
            build/artifact/stdlib/
